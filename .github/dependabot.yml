version: 2
updates:
  - package-ecosystem: pub
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      pub-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pub
    directory: "/packages/belong_lints"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      belong-lints-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pub
    directory: "/sanctuary_server/sanctuary_server_client"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      serverpod-client-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: pub
    directory: "/sanctuary_server/sanctuary_server_server"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      serverpod-server-minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
