# TEMPORARY preview branch temp/carina-preview-991-992.
# A workflow_dispatch here publishes the dev Hosting site only.
# Do not merge this file. It refuses production Hosting.
name: Deploy

on:
  push:
    # temp/carina-preview-991-992 is a temporary main: a push deploys the dev
    # site the same way main does. It does not publish production.
    branches: [main, temp/carina-preview-991-992]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the dev deploy plan and skip Firebase
        type: boolean
        default: false
      production:
        description: Ignored on this temporary branch. Production Hosting is refused.
        type: boolean
        default: false
      distribute_android:
        description: Build a release APK and upload it to App Distribution
        type: boolean
        default: false

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve packages
        run: flutter pub get

      - name: Check Firebase credentials
        id: firebase_auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "mode=dry" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "mode=service_account" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Missing Firebase credentials."
          echo "Add repository secret FIREBASE_SERVICE_ACCOUNT (service account JSON) or FIREBASE_TOKEN."
          echo "See DEPLOYMENT.md."
          exit 1

      - uses: google-github-actions/auth@v3
        if: steps.firebase_auth.outputs.mode == 'service_account'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        if: steps.firebase_auth.outputs.mode != 'dry'
        run: npm install -g firebase-tools

      - name: Deploy hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_ANDROID_DEV_APP_ID: ${{ secrets.FIREBASE_ANDROID_DEV_APP_ID }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
          # Dev web only. tool/deploy_release.dart must not pass this define.
          DEV_EXAMPLE_PASSWORD: ${{ secrets.DEV_EXAMPLE_PASSWORD }}
          # Preview group call on the dev web build. The endpoint is a public
          # mint that returns 401 without sign-in. A repository variable wins
          # when it is set; otherwise the shell uses the documented preview URL.
          STREAM_VIDEO_PREVIEW: "true"
          STREAM_TOKEN_ENDPOINT: "${{ vars.STREAM_TOKEN_ENDPOINT }}"
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          # This temporary branch never publishes production Hosting, Cloud
          # Functions, or security rules, and it never runs deploy_release.dart.
          if [ "${{ github.ref_type }}" = "tag" ] || { [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production }}" = "true" ]; }; then
            echo "Refusing production publish from temp/carina-preview-991-992."
            echo "This branch deploys the dev Hosting site only."
            exit 1
          fi
          if [ -z "${STREAM_TOKEN_ENDPOINT:-}" ]; then
            STREAM_TOKEN_ENDPOINT='https://kcgsbtaamipkfmiluczb.supabase.co/functions/v1/mint-stream-call-token'
            export STREAM_TOKEN_ENDPOINT
          fi
          echo "Deploy target: dev Hosting only (dev-belongonthespectrum). Production, functions, and rules are not deployed."
          echo "Stream video preview flag is on. Token endpoint is set. The endpoint value is not printed."
          if [ "${{ steps.firebase_auth.outputs.mode }}" = "dry" ]; then
            flutter pub run tool/deploy_dev_web.dart --version "ci-$short" --dry-run
          else
            dev_args=(--version "ci-$short" --build-android)
            if [ -n "${FIREBASE_ANDROID_DEV_APP_ID:-}" ]; then
              dev_args+=(--distribute-android)
            fi
            flutter pub run tool/deploy_dev_web.dart "${dev_args[@]}"
          fi

      - name: Upload dev APK artifact
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: refuge-dev-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
