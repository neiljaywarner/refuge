name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the release plan and skip Firebase
        type: boolean
        default: false
      production:
        description: Publish production Hosting. Leave off unless this is a release.
        type: boolean
        default: false
      distribute_android:
        description: Build a release APK and upload it to App Distribution
        type: boolean
        default: false

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Resolve packages
        run: flutter pub get

      - name: Check Firebase credentials
        id: firebase_auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "mode=dry" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "mode=service_account" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Missing Firebase credentials."
          echo "Add repository secret FIREBASE_SERVICE_ACCOUNT (service account JSON) or FIREBASE_TOKEN."
          echo "See DEPLOYMENT.md."
          exit 1

      - uses: google-github-actions/auth@v2
        if: steps.firebase_auth.outputs.mode == 'service_account'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        if: steps.firebase_auth.outputs.mode != 'dry'
        run: npm install -g firebase-tools

      - name: Deploy hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          FIREBASE_ANDROID_DEV_APP_ID: ${{ secrets.FIREBASE_ANDROID_DEV_APP_ID }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
          # Dev web only. tool/deploy_release.dart must not pass this define.
          DEV_EXAMPLE_PASSWORD: ${{ secrets.DEV_EXAMPLE_PASSWORD }}
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          # Push to main deploys the dev site only. Production is a v* tag or an explicit release run.
          if [ "${{ steps.firebase_auth.outputs.mode }}" = "dry" ]; then
            flutter pub run tool/deploy_release.dart --version "ci-$short" --dry-run
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            flutter pub run tool/deploy_release.dart --version "${GITHUB_REF_NAME}" --prod
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production }}" = "true" ]; then
            args=(--version "release-$short" --prod)
            if [ "${{ inputs.distribute_android }}" = "true" ]; then
              args+=(--distribute-android)
            fi
            flutter pub run tool/deploy_release.dart "${args[@]}"
          else
            dev_args=(--version "ci-$short" --build-android)
            if [ -n "${FIREBASE_ANDROID_DEV_APP_ID:-}" ]; then
              dev_args+=(--distribute-android)
            fi
            flutter pub run tool/deploy_dev_web.dart "${dev_args[@]}"
          fi

      - name: Upload dev APK artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: refuge-dev-release-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
