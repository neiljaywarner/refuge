name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the release plan and skip Firebase
        type: boolean
        default: false
      production:
        description: Publish production Hosting. Leave off unless this is a release.
        type: boolean
        default: false
      distribute_android:
        description: Build a release APK and upload it to App Distribution
        type: boolean
        default: false

concurrency:
  group: firebase-hosting-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Resolve packages
        run: flutter pub get

      - name: Check Firebase credentials
        id: firebase_auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "mode=dry" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "mode=service_account" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$FIREBASE_TOKEN" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Missing Firebase credentials."
          echo "Add repository secret FIREBASE_SERVICE_ACCOUNT (service account JSON) or FIREBASE_TOKEN."
          echo "See DEPLOYMENT.md."
          exit 1

      - uses: google-github-actions/auth@v3
        if: steps.firebase_auth.outputs.mode == 'service_account'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        if: steps.firebase_auth.outputs.mode != 'dry'
        run: npm install -g firebase-tools

      - name: Deploy hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_ANDROID_APP_ID: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          APTABASE_KEY: ${{ secrets.APTABASE_KEY }}
          POSTHOG_KEY: ${{ secrets.POSTHOG_KEY }}
          POSTHOG_HOST: https://us.i.posthog.com
        run: |
          set -eu
          short="${GITHUB_SHA::7}"
          # Push to main deploys the dev site only. Production is a v* tag or an explicit release run.
          if [ "${{ steps.firebase_auth.outputs.mode }}" = "dry" ]; then
            dart run tool/deploy_release.dart --version "ci-$short" --dry-run
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            dart run tool/deploy_release.dart --version "${GITHUB_REF_NAME}" --prod
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.production }}" = "true" ]; then
            args=(--version "release-$short" --prod)
            if [ "${{ inputs.distribute_android }}" = "true" ]; then
              args+=(--distribute-android)
            fi
            dart run tool/deploy_release.dart "${args[@]}"
          else
            dart run tool/deploy_dev_web.dart --version "ci-$short"
          fi
