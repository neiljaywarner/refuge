# Daily dev-only Firebase Test Lab smoke (hello-world Patrol instrumentation).
# Secret: FIREBASE_SERVICE_ACCOUNT (service-account JSON; see issue #493 / #573).
# Do not commit client_email. Read it from that secret when granting IAM.
# A 403 storage.objects.create on gs://test-lab-* needs roles/editor on that
# account, or repository variable FTL_RESULTS_BUCKET (a bucket the project owns).
# Commands: docs/wiki/Firebase-Test-Lab-and-Patrol-Guide.md

name: Firebase Test Lab (daily, dev APK)

on:
  schedule:
    - cron: '0 7 * * *' # 07:00 UTC = 1:00 AM Central (CST)
  workflow_dispatch:
    inputs:
      target:
        description: Dev-only Patrol target
        required: false
        default: integration_test/patrol_ftl_home_shell_test.dart
        type: choice
        options:
          - integration_test/patrol_ftl_home_shell_test.dart
          - integration_test/patrol_ftl_attach_media_test.dart

concurrency:
  group: ftl-daily-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  test-lab-dev-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Scheduled runs keep the home-shell smoke. Dispatch can select the
      # attach-media target. Upload stays on the .dev package.
      FTL_TARGET: ${{ github.event.inputs.target || 'integration_test/patrol_ftl_home_shell_test.dart' }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Resolve packages
        run: flutter pub get

      - name: Install Patrol CLI
        # Same builder as a local `patrol test` (bundle + server ports).
        # patrol 4.10 needs patrol_cli >= 4.8.0. Do not pass --flavor:
        # this app has no assembleDevDebug; FLAVOR=dev is a dart-define.
        run: |
          dart pub global activate patrol_cli 4.8.0
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"

      - name: Unit tests (FTL helpers)
        run: flutter test test/tool/firebase_test_lab_support_test.dart

      - name: Build dev APK pair and verify badging
        run: dart run tool/run_firebase_test_lab.dart --build-only --target "$FTL_TARGET"

      - name: Check Firebase credentials
        id: ftl_auth
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "has_sa=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_sa=false" >> "$GITHUB_OUTPUT"
            echo "FIREBASE_SERVICE_ACCOUNT is not set. Build-only gate passed; skipping upload."
            echo "Add the secret to enable daily cloud upload (issue #573)."
          fi

      - name: Authenticate to Google Cloud
        if: steps.ftl_auth.outputs.has_sa == 'true'
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: steps.ftl_auth.outputs.has_sa == 'true'
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: belongonthespectrum

      - name: Upload to Firebase Test Lab
        if: steps.ftl_auth.outputs.has_sa == 'true'
        env:
          FTL_RESULTS_BUCKET: ${{ vars.FTL_RESULTS_BUCKET }}
        run: dart run tool/run_firebase_test_lab.dart --target "$FTL_TARGET"
