version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sanctuary_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sanctuary
    ports:
      - '8090:5432'
    volumes:
      - sanctuary_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sanctuary_redis
    ports:
      - '8091:6379'

volumes:
  sanctuary_pgdata:
