appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
name: "Notification Deep Link Flow (Issue #330)"
tags:
  - notifications
  - deep-link
  - dms
  - navigation
  - regression
---
# Seeded rows are visible text, not notification_list_tile_* resource ids.
# DM copy includes "sent you a direct message" and "Welcome to Belong".
# Mention copy includes "mentioned you".

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Notifications tab.*"
    timeout: 45000

- tapOn: ".*Notifications tab.*"
- extendedWaitUntil:
    visible: ".*sent you a direct message.*"
    timeout: 15000
- assertVisible: "Notifications.*"

- tapOn: ".*sent you a direct message.*"
- extendedWaitUntil:
    visible: ".*Welcome to Belong.*"
    timeout: 15000
- assertVisible: ".*Marty.*"
- assertVisible: ".*Welcome to Belong.*"

- tapOn: ".*Notifications tab.*"
- extendedWaitUntil:
    visible: ".*mentioned you.*"
    timeout: 15000

- tapOn: ".*mentioned you.*"
- extendedWaitUntil:
    visible: ".*(Home tab|Vote & Feedback).*"
    timeout: 15000
- assertVisible: ".*(Home tab|Vote & Feedback).*"
