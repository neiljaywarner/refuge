appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
name: "Full Calm Notifications Journey & OS Shade Test"
tags:
  - notifications
  - bell
  - mentions
  - dms
  - regression
---
# Bottom nav is text ("Notifications tab"), not belong_bottom_nav_bar.
# Filter chips are Inbox, Mentions, Direct Messages, Threads, Following.
# Preferences control: "Calm Notification Preferences".

- setPermissions:
    permissions:
      notifications: allow

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Notifications tab.*"
    timeout: 45000
- assertVisible: ".*Notifications tab.*"

- tapOn: ".*Notifications tab.*"
- extendedWaitUntil:
    visible: ".*Mark all read.*"
    timeout: 15000
- assertVisible: "Notifications.*"
- assertVisible: ".*(All notifications are delivered gently|Demo Mode).*"

- assertVisible: ".*Inbox.*"
- assertVisible: ".*Mentions.*"
- assertVisible: ".*Direct Messages.*"
- assertVisible: ".*Threads.*"
# Following sits on the horizontal chip row, past Threads, and is omitted
# from the tree until that row scrolls. A screen-level scroll does not move it.
- swipe:
    start: "90%, 25%"
    end: "20%, 25%"
    duration: 350
- extendedWaitUntil:
    visible: ".*Following.*"
    timeout: 8000

- tapOn: ".*Mentions.*"
- assertVisible: ".*mentioned you.*"

- tapOn: ".*Direct Messages.*"
- assertVisible: ".*direct message.*"

# The Following swipe moves Inbox off the left edge. Swipe it back.
- swipe:
    start: "20%, 25%"
    end: "90%, 25%"
    duration: 350
- tapOn: ".*Inbox.*"
- tapOn: ".*Mark all read.*"

- tapOn: ".*Calm Notification Preferences.*"
- extendedWaitUntil:
    visible: ".*Calm Notification Ethics.*"
    timeout: 10000
- assertVisible: ".*Calm Notification Ethics.*"

- tapOn: ".*Preview shade notification.*"

- pressKey: Home
- swipe:
    start: "50%, 2%"
    end: "50%, 55%"
    duration: 400

- assertVisible:
    text: ".*Belong.*"
    optional: true

- tapOn:
    text: ".*Belong.*"
    optional: true

# Close the shade, then bring the app forward. Back alone can land on the launcher.
- pressKey: back
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible: ".*Vote & Feedback.*"
    timeout: 30000
- assertVisible: ".*Vote & Feedback.*"
