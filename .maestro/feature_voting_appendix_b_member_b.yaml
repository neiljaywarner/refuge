appId: com.belongonthespectrum.refuge.dev
name: "Feature voting Appendix B — Member B (#783)"
tags:
  - belong
  - feature-voting
  - firestore
  - appendix-b
---
# Second synthetic dev account (example.com). Register once manually if missing.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 60000
- tapOn:
    text: "Email"
- inputText: "voting-e2e-733-b@example.com"
- tapOn:
    text: "Password"
- inputText: "TestPass733E2eB"
- tapOn:
    text: "Sign in"
- extendedWaitUntil:
    visible: "Save & Enter Belong|Welcome to Belong on the Spectrum|Feed"
    timeout: 90000
- runFlow:
    when:
      visible: "Save & Enter Belong"
    commands:
      - tapOn: "Skip for now"
- extendedWaitUntil:
    visible: "Welcome to Belong on the Spectrum|Feed"
    timeout: 60000
- tapOn:
    text: ".*Vote & Feedback.*"
- extendedWaitUntil:
    visible: "Belong Roadmap & Feedback"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "vote_planned-native-store-apps"
    direction: DOWN
    timeout: 25000
- takeScreenshot: member_b_before_vote
- runFlow:
    when:
      visible: "Vote for Native iOS App Store and Google Play Apps"
    commands:
      - tapOn:
          id: "vote_planned-native-store-apps"
- extendedWaitUntil:
    visible: "Remove vote for Native iOS App Store and Google Play Apps"
    timeout: 30000
- takeScreenshot: member_b_after_vote
