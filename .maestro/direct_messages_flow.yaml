appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
name: "Direct Messages and Calm Private Fellowship Flow"
tags:
  - messages
  - fellowship
  - regression
---
# Bottom nav label is "Messages" (semantics: "Messages tab"), not a bare "Msgs" id.
# Thread list includes Marty. Reply field hint: "Type a calm reply...".

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Messages tab.*"
    timeout: 45000

- tapOn: ".*Messages tab.*"
- extendedWaitUntil:
    visible: ".*Direct Messages.*"
    timeout: 15000
- assertVisible: ".*Direct Messages.*"

- tapOn: ".*Marty.*"
- extendedWaitUntil:
    visible: ".*Welcome to Belong.*"
    timeout: 15000
- assertVisible: ".*Welcome to Belong.*"

- tapOn: ".*Type a calm reply.*"
- inputText: "Thank you Marty! Glad to be here."
- pressKey: Enter
- assertVisible: ".*Thank you Marty.*"
