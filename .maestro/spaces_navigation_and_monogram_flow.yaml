appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
---
# Spaces directory. Live headings include PINNED, WELCOME, and COMMUNITY.
# Member row: "Members Section & Directory". Back control tooltip: "Back to Spaces".

- launchApp:
    clearState: false

- runFlow:
    file: subflows/dev_saved_account_home.yaml

- extendedWaitUntil:
    visible: ".*\\bFeed\\b.*"
    timeout: 45000
- assertVisible: ".*\\bFeed\\b.*"
- assertVisible: ".*Spaces.*"

- tapOn: ".*Spaces.*"
- extendedWaitUntil:
    visible: ".*COMMUNITY.*"
    timeout: 15000
- assertVisible: ".*COMMUNITY.*"

# Soft-launch smoke (#796): Links are visible. Do not tap DFW Church or the
# store rows — those leave the app. Community Guidelines stays pending.
- scrollUntilVisible:
    element: ".*\\bLINKS\\b.*"
    direction: DOWN
    timeout: 20000
    centerElement: true
- assertVisible: ".*Community Guidelines.*"
- assertVisible: ".*DFW Church.*"
- assertVisible: ".*Download the Android App.*"

- scrollUntilVisible:
    element: ".*Members Section & Directory.*"
    direction: UP
    timeout: 20000
- tapOn: ".*Members Section & Directory.*"
- extendedWaitUntil:
    visible: ".*Member Directory.*"
    timeout: 15000
- assertVisible: ".*Member Directory.*"
- assertVisible: ".*Marty.*"
- assertVisible: ".*Community Organizer.*"

- tapOn: ".*Back to Spaces.*"
- tapOn: ".*\\bFeed\\b.*"
- assertVisible: ".*\\bFeed\\b.*"
