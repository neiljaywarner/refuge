appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. Tagged known-gap so the default suite does not
# register an account. Pass BELONG_AUTH_NAME, BELONG_AUTH_EMAIL, and
# BELONG_AUTH_PASSWORD in the environment. Use a synthetic address such
# as tester-<timestamp>@example.com and the name Fellow Member.
tags:
  - known-gap
  - auth
---
- launchApp:
    clearState: true

- extendedWaitUntil:
    visible: ".*Sign In.*"
    timeout: 45000
- tapOn: ".*Sign In.*"
- extendedWaitUntil:
    visible: ".*Register.*"
    timeout: 20000
- tapOn: ".*Register.*"
- tapOn: ".*Email.*"
- inputText: ${BELONG_AUTH_EMAIL}
- tapOn: ".*Password.*"
- inputText: ${BELONG_AUTH_PASSWORD}
- tapOn: ".*Register.*"

- extendedWaitUntil:
    visible: ".*Delete my account.*"
    timeout: 45000
    optional: true
- tapOn:
    text: ".*profile.*"
    optional: true
- scrollUntilVisible:
    element: "Delete my account"
    direction: DOWN
    timeout: 20000
- tapOn: "Delete my account"
- tapOn: "Type DELETE to confirm"
- inputText: "DELETE"
- tapOn: "Delete account"

- extendedWaitUntil:
    visible: ".*Sign In.*"
    timeout: 30000
- tapOn: ".*Sign In.*"
- tapOn: ".*Email.*"
- inputText: ${BELONG_AUTH_EMAIL}
- tapOn: ".*Password.*"
- inputText: ${BELONG_AUTH_PASSWORD}
- tapOn: ".*Sign [Ii]n.*"

- extendedWaitUntil:
    visible: ".*Type RESTORE to come back.*"
    timeout: 30000
- assertVisible: "An organizer cannot turn this back on for you."
- tapOn: "Type RESTORE to come back"
- inputText: "RESTORE"
- tapOn: "Come back"

- extendedWaitUntil:
    notVisible: ".*Type RESTORE to come back.*"
    timeout: 30000
