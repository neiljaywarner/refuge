appId: com.belongonthespectrum.refuge.dev
---
# Every feed sort option on a debug dev build (#485).
# Release/prod applicationId is com.belongonthespectrum.refuge (no .dev suffix).
#
# A 1080-wide phone only puts Latest, For you, New Activity, and a clipped
# Oldest chip in the semantics tree. Popular, Likes, and Alphabetical sit in
# the nested horizontal scroller and are not exposed until that scroller
# moves. scrollUntilVisible cannot target them, and a screen-level swipe at
# the chip row scrolls the feed instead. Those three options (and a second
# pass over the rest) go through the sort menu, which calls the same
# selection callback as the chips.
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Demo Mode.*"
    timeout: 45000

- tapOn:
    id: "feed_sort_chip_latest"
- tapOn:
    id: "feed_sort_chip_forYou"
- tapOn:
    id: "feed_sort_chip_newActivity"
- tapOn:
    id: "feed_sort_chip_oldest"
- tapOn:
    id: "feed_sort_chip_oldest"

- tapOn:
    id: "feed_sort_popup_button"
- extendedWaitUntil:
    visible:
      id: "feed_sort_menu_item_popular"
    timeout: 10000
- tapOn:
    id: "feed_sort_menu_item_popular"
- extendedWaitUntil:
    visible: "Demo Mode.*"
    timeout: 10000

- tapOn:
    id: "feed_sort_popup_button"
- extendedWaitUntil:
    visible:
      id: "feed_sort_menu_item_likes"
    timeout: 10000
- tapOn:
    id: "feed_sort_menu_item_likes"
- extendedWaitUntil:
    visible: "Demo Mode.*"
    timeout: 10000

- tapOn:
    id: "feed_sort_popup_button"
- extendedWaitUntil:
    visible:
      id: "feed_sort_menu_item_alphabetical"
    timeout: 10000
- tapOn:
    id: "feed_sort_menu_item_alphabetical"
- extendedWaitUntil:
    visible: "Demo Mode.*"
    timeout: 10000

- tapOn:
    id: "feed_sort_popup_button"
- extendedWaitUntil:
    visible:
      id: "feed_sort_menu_item_latest"
    timeout: 10000
- tapOn:
    id: "feed_sort_menu_item_latest"
- extendedWaitUntil:
    visible: "Demo Mode.*"
    timeout: 10000

- tapOn:
    id: "feed_sort_popup_button"
- extendedWaitUntil:
    visible:
      id: "feed_sort_menu_item_forYou"
    timeout: 10000
- tapOn:
    id: "feed_sort_menu_item_forYou"
- assertVisible:
    id: "feed_sort_chip_forYou"

- tapOn:
    id: "tone_filter_chip_comfort_only"
- extendedWaitUntil:
    visible: ".*sensory fatigue.*"
    timeout: 10000
- tapOn:
    id: "tone_filter_chip_all"
# For you ranks the comfort reflection above the prayer seed, and a phone
# only keeps the first cards in the semantics tree. The comfort post staying
# visible after All proves the filter cleared without dropping the feed.
- assertVisible: "Demo Mode.*"
- assertVisible: ".*quiet space exists.*"
- assertVisible:
    id: "feed_sort_chip_forYou"
- takeScreenshot: maestro_feed_sort_every_option
