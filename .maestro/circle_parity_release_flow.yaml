appId: com.belongonthespectrum.sanctuary
name: "Circle Parity & Calm Notification Ethics Flow"
tags:
  - circle-parity
  - spaces
  - member-directory
  - calm-fcm
  - release
---
# 1. Launch Refuge Application
- launchApp:
    clearState: false

# 2. Assert Feed and Spaces Navigation
- assertVisible: "Feed"
- assertVisible: "Spaces"
- tapOn: "Spaces"

# 3. Assert Circle Sections and Member Directory
- assertVisible: "PINNED"
- assertVisible: "COMMUNITY"
- assertVisible: ".*Members Section & Directory.*"
- tapOn: ".*Members Section & Directory.*"

# 4. Assert Member Directory screen & Fellowship leaders
- assertVisible: ".*Member Directory.*"
- assertVisible: ".*Marty.*"
- tapOn: "Back to Spaces"

# 5. Return to Spaces then Navigate to Calm Notifications & Preferences (Opt-In Primer)
- assertVisible: "PINNED"
- tapOn:
    point: "470,2250" # Notifications bottom nav tab
- assertVisible: ".*Notifications.*"
- assertVisible: ".*All notifications are delivered gently without intrusive sound alerts.*"
- tapOn:
    point: "1017,284" # Calm notification preferences button
- assertVisible: ".*Calm Notification Ethics.*"
- assertVisible: ".*Belong respects your attention and sensory peace.*"
- assertVisible: ".*Receive Push Digests.*"

# 6. Dismiss and return to Feed
- tapOn:
    point: "540,2274" # Save & Return button
- tapOn:
    point: "94,2250" # Home bottom nav tab
- assertVisible: "Feed"
