appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
name: "Circle Parity & Calm Notification Ethics Flow"
tags:
  - circle-parity
  - spaces
  - member-directory
  - calm-fcm
  - release
---
# Spaces headings PINNED and COMMUNITY are on the directory. Bottom nav and
# preferences are labeled text, not screen-percentage taps.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Feed.*"
    timeout: 45000
- assertVisible: ".*Feed.*"
- assertVisible: ".*Spaces.*"
- tapOn: ".*Spaces.*"

- extendedWaitUntil:
    visible: ".*COMMUNITY.*"
    timeout: 15000
- assertVisible: ".*PINNED.*"
- assertVisible: ".*COMMUNITY.*"
- scrollUntilVisible:
    element: ".*Members Section & Directory.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*Members Section & Directory.*"

- extendedWaitUntil:
    visible: ".*Member Directory.*"
    timeout: 15000
- assertVisible: ".*Member Directory.*"
- assertVisible: ".*Marty.*"
- tapOn: ".*Back to Spaces.*"

- assertVisible: ".*PINNED.*"
- tapOn: ".*Notifications tab.*"
- extendedWaitUntil:
    visible: ".*Notifications.*"
    timeout: 15000
- assertVisible: ".*(All notifications are delivered gently|Demo Mode).*"
- tapOn: ".*Calm Notification Preferences.*"
- extendedWaitUntil:
    visible: ".*Calm Notification Ethics.*"
    timeout: 10000
- assertVisible: ".*Calm Notification Ethics.*"
- assertVisible: ".*Belong respects your attention and sensory peace.*"
- assertVisible: ".*Receive Push Digests.*"

- tapOn: ".*Save & Return.*"
- tapOn: ".*Home tab.*"
- assertVisible: ".*Feed.*"
