appId: com.belongonthespectrum.refuge.dev
name: "Preview call start and stop screen share"
tags:
  - known-gap
  - screenshare
  - issue-928
---
# Black-box share for a signed-in preview build (#928).
# The default `maestro test .maestro` suite excludes known-gap, because
# this flow needs Join call on screen. It does not type a password,
# a token, or an email.
#
#   maestro test .maestro/group_call_screen_share.yaml
#
# Share screen / Stop sharing are the semantics labels on the share button.
# You are sharing is the presenter label while this device is publishing.
- launchApp
- extendedWaitUntil:
    visible: "Join call"
    timeout: 30000
- tapOn: "Join call"
- extendedWaitUntil:
    visible: "Share screen"
    timeout: 30000
- tapOn: "Share screen"
- extendedWaitUntil:
    visible: "Stop sharing"
    timeout: 20000
- assertVisible: "You are sharing"
- tapOn: "Stop sharing"
- extendedWaitUntil:
    visible: "Share screen"
    timeout: 15000
- assertNotVisible: "You are sharing"
