appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
tags:
  - known-gap
  - auth
---
# Blocked from the default suite (known-gap). Do not put a real email or
# password in this file. When someone runs it on purpose, pass
# BELONG_AUTH_NAME, BELONG_AUTH_EMAIL, and BELONG_AUTH_PASSWORD in the
# environment. Use a synthetic name such as Fellow Member.
# Live sign-in uses SimpleSignInScreen ("Sign in to Belong on the Spectrum", Register,
# "Forgotten password?"), not the older custom registration sheet.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Sign In.*"
    timeout: 45000
- tapOn: ".*Sign In.*"
- extendedWaitUntil:
    visible: ".*Register.*"
    timeout: 20000
- takeScreenshot: screenshots/auth_01_signin_tab

- tapOn: ".*Register.*"
- takeScreenshot: screenshots/auth_02_register_tab

- tapOn: ".*Email.*"
- inputText: ${BELONG_AUTH_EMAIL}
- tapOn: ".*Password.*"
- inputText: ${BELONG_AUTH_PASSWORD}
- takeScreenshot: screenshots/auth_03_registration_filled

- tapOn: ".*Register.*"
- takeScreenshot: screenshots/auth_04_joined_success
