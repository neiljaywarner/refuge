appId: so.circle.circle
# Not a Belong package. Belong debug verification uses
# com.belongonthespectrum.refuge.dev. Production is
# com.belongonthespectrum.refuge. Legacy sanctuary id is retired.
# See .maestro/config.yaml.
---
# Circle App (so.circle.circle) — read-only UI discovery.
#
# 1. Never clear state (clearState: false). That preserves the signed-in community.
# 2. Read-only navigation: tabs, spaces, and discussion feeds only.
# 3. No create, reply, publish, leave, delete, or sign-out taps.
# 4. Do not commit screenshots that show member identities.

- launchApp:
    clearState: false

- waitForAnimationToEnd:
    timeout: 5000

- takeScreenshot: screenshots/01_circle_initial_anchor

- tapOn:
    text: "Spaces.*"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: screenshots/02_circle_spaces_list

- tapOn:
    point: "50%,40%"
    optional: true

- waitForAnimationToEnd:
    timeout: 3000

- takeScreenshot: screenshots/03_circle_discussion_feed

- back

- waitForAnimationToEnd:
    timeout: 2000

- takeScreenshot: screenshots/04_circle_safe_return_root
