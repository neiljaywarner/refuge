appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
name: "Belong on the Spectrum — 1-Tap Feature Voting & Literal 3-Intent Feedback E2E"
tags:
  - belong
  - feature-voting
  - adr-0007
  - adr-0009
---
- launchApp
- extendedWaitUntil:
    visible: ".*Vote & Feedback.*"
    timeout: 45000
- assertVisible: ".*Belong.*"
- tapOn: ".*Vote & Feedback.*"
- extendedWaitUntil:
    visible: ".*Belong Roadmap & Feedback.*"
    timeout: 15000
- assertVisible: ".*Native iOS App Store and Google Play Apps.*"
# Read-only. Do not tap a vote count from the default suite.
- tapOn: ".*Share Feedback.*"
- assertVisible: ".*Works Great.*"
- assertVisible: ".*Idea / Tweak.*"
- assertVisible: ".*Bug / Confusing.*"
- tapOn: ".*Idea / Tweak.*"
- assertVisible: ".*What would make Belong clearer or calmer for you.*"
