appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. Production is com.belongonthespectrum.refuge.
# Legacy com.belongonthespectrum.sanctuary is not the current applicationId.
# See .maestro/config.yaml.
---
# Requires Home. "Vote & Feedback" is behind the sign-in wall (#601).
# Meme gallery on the live dev build (emulator accessibility tree).
# Flutter Keys such as add_meme_gif_button, meme_upload_camera_button, and
# meme_gallery_close_button are not resource ids in the tree.
# Visible labels: Spaces row "Memes", composer "Add Meme / GIF",
# sheet "Attach media", row "More", then "Photo", button "Use Camera".
# The close control is an unlabeled Button, so Back dismisses the sheet.
# These steps are required; a missing label fails the flow.
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Vote & Feedback.*"
    timeout: 45000
- assertVisible: ".*Belong.*"

- tapOn: ".*Spaces.*"
- extendedWaitUntil:
    visible: ".*Memes.*"
    timeout: 15000
- tapOn: ".*Memes.*"
- extendedWaitUntil:
    visible: ".*Add Meme / GIF.*"
    timeout: 15000
- assertVisible: ".*Add Meme / GIF.*"

- tapOn: ".*Add Meme / GIF.*"
- extendedWaitUntil:
    visible: ".*Attach media.*"
    timeout: 15000
- assertVisible: ".*Attach media.*"

- tapOn:
    text: "^More$"
    below: "Attach media"
- tapOn:
    text: "^Photo$"
    below: "Belong memes"
- extendedWaitUntil:
    visible: ".*Use Camera.*"
    timeout: 10000
- assertVisible: ".*Use Camera.*"
- assertVisible: ".*Choose Photo.*"

# Read-only smoke: does not pick a photo. For real gallery pick + attach, run
# meme_gallery_photo_upload_e2e.yaml (and avatar_gallery_change_e2e.yaml).
# Do not open the system camera here. Back closes the unlabeled sheet.
- pressKey: back
- assertNotVisible: ".*Attach media.*"
- assertVisible: ".*Add Meme / GIF.*"
