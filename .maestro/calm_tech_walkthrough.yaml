appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
---
# Refuge calm-tech walkthrough. Header copy is "Belong", "Refuge", and
# "Calm Tech • Live" or "Calm Tech • Resilient". Space titles live under Spaces.

- launchApp

- extendedWaitUntil:
    visible: ".*Vote & Feedback.*"
    timeout: 45000
- assertVisible: ".*Belong.*"
- assertVisible: ".*Refuge.*"
- assertVisible: ".*Calm Tech.*"

- tapOn: ".*Spaces.*"
- extendedWaitUntil:
    visible: ".*General Chat.*"
    timeout: 15000
- tapOn: ".*General Chat.*"
- extendedWaitUntil:
    visible: ".*Share an unhurried thought.*"
    timeout: 15000

- tapOn: ".*Spaces.*"
- tapOn: ".*Memes.*"
- extendedWaitUntil:
    visible: ".*Add Meme / GIF.*"
    timeout: 15000
- assertVisible: ".*Add Meme / GIF.*"

- tapOn: ".*Spaces.*"
- scrollUntilVisible:
    element: ".*Online Resources.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*Online Resources.*"

# Menu rows expose sensory_theme_${mode.name}. The accessible name is
# "Dark\nDark" (label repeated), so a prefix regex "Dark.*" does not match.
- tapOn:
    id: "sensory_theme_toggle_button"
- tapOn:
    id: "sensory_theme_charcoal"
- assertVisible: ".*Refuge.*"

- tapOn:
    id: "sensory_theme_toggle_button"
- tapOn:
    id: "sensory_theme_contrast"
- assertVisible: ".*Refuge.*"

- tapOn:
    id: "sensory_theme_toggle_button"
- tapOn:
    id: "sensory_theme_sage"
- assertVisible: ".*Refuge.*"

# Read-only. Do not type a reflection or tap Publish Reflection.
- tapOn: ".*Feed.*"
- assertVisible: ".*Share an unhurried thought.*"
- assertVisible: ".*Add Meme / GIF.*"
