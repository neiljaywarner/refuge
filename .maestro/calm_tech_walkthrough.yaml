appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
---
# Refuge calm-tech walkthrough. Header copy is "Belong", "Refuge", and
# "Calm Tech • Live" or "Calm Tech • Resilient". Space titles live under Spaces.

- launchApp

- extendedWaitUntil:
    visible: ".*Vote & Feedback.*"
    timeout: 45000
- assertVisible: ".*Belong.*"
- assertVisible: ".*Refuge.*"
- assertVisible: ".*Calm Tech.*"

- tapOn: ".*Spaces.*"
- extendedWaitUntil:
    visible: ".*General Chat.*"
    timeout: 15000
- tapOn: ".*General Chat.*"
- extendedWaitUntil:
    visible: ".*Share an unhurried thought.*"
    timeout: 15000

- tapOn: ".*Spaces.*"
- tapOn: ".*Memes.*"
- extendedWaitUntil:
    visible: ".*Add Meme / GIF.*"
    timeout: 15000
- assertVisible: ".*Add Meme / GIF.*"

- tapOn: ".*Spaces.*"
- scrollUntilVisible:
    element: ".*Online Resources.*"
    direction: DOWN
    timeout: 15000
- tapOn: ".*Online Resources.*"

- tapOn: ".*Sensory Themes.*"
- tapOn: "Dark.*"
- assertVisible: ".*Refuge.*"

- tapOn: ".*Sensory Themes.*"
- tapOn: "Contrast.*"
- assertVisible: ".*Refuge.*"

- tapOn: ".*Sensory Themes.*"
- tapOn: "Sage.*"
- assertVisible: ".*Refuge.*"

- tapOn:
    id: "reflection_composer"
    optional: true
- runFlow:
    when:
      visible: ".*Expand.*"
    commands:
      - tapOn: ".*Expand.*"
- tapOn: ".*Share an unhurried thought.*"
- inputText: "Peace be with this fellowship in quiet waters."
- hideKeyboard
# The emulator sometimes covers the composer with a stylus handwriting sheet.
- runFlow:
    when:
      visible: ".*Try out your stylus.*"
    commands:
      - tapOn: "Cancel"
      - hideKeyboard
- extendedWaitUntil:
    visible: ".*Publish Reflection.*"
    timeout: 15000
- tapOn: ".*Publish Reflection.*"
# A guest demo session keeps the quiet-space placeholder. A signed-in
# session lists the sentence. Either label means the composer action landed.
- assertVisible: ".*(Peace be with this fellowship in quiet waters|quiet, unhurried space).*"
