appId: com.belongonthespectrum.refuge.dev
name: "Profile avatar — gallery pick smoke"
tags:
  - belong
  - avatar
  - upload-e2e
  - issue-559
  - known-gap
---
# Gallery-based avatar change. Tagged known-gap when guest mode blocks profile save.
# Injects a test image, opens the profile avatar control, picks from gallery.

- launchApp:
    clearState: false

- setPermissions:
    permissions:
      camera: allow
      photos: allow

- addMedia:
    - "assets/belong_maestro_test_photo.png"

- extendedWaitUntil:
    visible: ".*Belong.*"
    timeout: 45000

- tapOn:
    id: "belong_profile_avatar_button"
- extendedWaitUntil:
    visible: ".*Member Profile.*"
    timeout: 15000

- tapOn:
    id: "edit_avatar_button"
- extendedWaitUntil:
    visible: ".*Take Photo with Camera.*"
    timeout: 10000

- tapOn: ".*Choose from Photos / Gallery.*"
- waitForAnimationToEnd:
    timeout: 8000

- runFlow:
    when:
      visible: ".*belong_maestro_test_photo.*"
    commands:
      - tapOn: ".*belong_maestro_test_photo.*"

- runFlow:
    when:
      notVisible: ".*Avatar updated peacefully.*"
    commands:
      - tapOn:
          point: "20%, 35%"
      - waitForAnimationToEnd

- extendedWaitUntil:
    visible: ".*Avatar updated peacefully.*"
    timeout: 25000
