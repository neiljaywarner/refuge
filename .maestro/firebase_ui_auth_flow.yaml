appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
name: "Belong on the Spectrum — FirebaseUI Auth E2E Flow"
tags:
  - belong
  - auth
  - firebase_ui_auth
  - e2e
---
# Read-only navigation on the members-only sign-in wall (#574, #601).
# Does not create an account or send a password reset.
# Live/dev title uses "Sign in to Belong on the Spectrum" (#717).

- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Sign in to Belong on the Spectrum.*"
    timeout: 45000
- assertVisible: ".*Don't have an account\\?.*"
- assertVisible: ".*Register.*"
- assertVisible: ".*Forgotten password\\?.*"

- tapOn: ".*Forgotten password\\?.*"
- extendedWaitUntil:
    visible: ".*Reset your password.*"
    timeout: 15000
- assertVisible: ".*Reset password.*"
- back
- assertVisible: ".*Sign in to Belong on the Spectrum.*"

- tapOn: ".*Register.*"
- extendedWaitUntil:
    visible: ".*Register.*"
    timeout: 15000
- assertVisible: ".*Already have an account\\?.*"

- back
- assertVisible: ".*Sign in to Belong on the Spectrum.*"
