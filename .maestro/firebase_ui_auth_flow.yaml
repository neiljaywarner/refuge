appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
name: "Belong on the Spectrum — FirebaseUI Auth E2E Flow"
tags:
  - belong
  - auth
  - firebase_ui_auth
  - e2e
---
# Read-only navigation. Does not create an account or send a password reset.
# Live sign-in route title is "Sign In to Belong". FirebaseUI shows
# "Don't have an account?", "Register", and "Forgotten password?".

- launchApp
- extendedWaitUntil:
    visible: ".*Vote & Feedback.*"
    timeout: 45000
- assertVisible: ".*Belong.*"
- assertVisible: ".*Sign In.*"

- tapOn: ".*Sign In.*"
- extendedWaitUntil:
    visible: ".*Forgotten password\\?.*"
    timeout: 20000
- assertVisible: ".*Sign in.*"
- assertVisible: ".*Don't have an account\\?.*"
- assertVisible: ".*Register.*"

- tapOn: ".*Forgotten password\\?.*"
- extendedWaitUntil:
    visible: ".*Reset your password.*"
    timeout: 15000
- assertVisible: ".*Reset password.*"
- back
- assertVisible: ".*Sign in.*"

- tapOn: ".*Register.*"
- extendedWaitUntil:
    visible: ".*Register.*"
    timeout: 15000
- assertVisible: ".*Already have an account\\?.*"

- back
- assertVisible: ".*Belong.*"
