appId: com.belongonthespectrum.refuge.dev
name: "Attach media — Giphy sheet on the dev package"
tags:
  - belong
  - meme
  - giphy
  - issue-762
---
# Dev package only. Does not publish a reflection and does not open the camera.
# Android/iOS show Open Giphy (official SDK dialog keeps Giphy's marks).
# Web/PWA shows the HTTP search field and "Powered by GIPHY" on this sheet.
#
# maestro test .maestro/attach_media_giphy_flow.yaml
# Package: com.belongonthespectrum.refuge.dev (lib/main_dev.dart, FLAVOR=dev).

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Vote & Feedback.*"
    timeout: 45000
- assertVisible: ".*Belong.*"

- tapOn: ".*Spaces.*"
- extendedWaitUntil:
    visible: ".*Memes.*"
    timeout: 15000
- tapOn: ".*Memes.*"
- extendedWaitUntil:
    visible: ".*Add Meme / GIF.*"
    timeout: 15000

- tapOn: ".*Add Meme / GIF.*"
- extendedWaitUntil:
    visible: ".*Attach media.*"
    timeout: 15000
- assertVisible: ".*Attach media.*"
# Exact "^More$" so this does not hit "Paste a link under More."
- assertVisible:
    text: "^More$"
    below: "Attach media"

# Phone builds: official picker entry. Do not treat a missing HTTP footer as a failure.
- runFlow:
    when:
      visible: "Open Giphy.*"
    commands:
      - assertVisible: "Open Giphy.*"
      - assertVisible: ".*silent GIF.*"

# Web/PWA builds: attribution stays on the search surface.
- runFlow:
    when:
      visible: "Powered by GIPHY"
    commands:
      - assertVisible: "Powered by GIPHY"
      - assertVisible: "Search"

# Unconfigured dev build: paste-a-link remains under More. Still do not publish.
- runFlow:
    when:
      visible: ".*not turned on.*"
    commands:
      - assertVisible: ".*Paste a link under More.*"

# id attach_media_more / attach_media_photo. Anchored exact text so the
# unconfigured sentence and any other "Photo" cannot win the tap.
- tapOn:
    text: "^More$"
    below: "Attach media"
- assertVisible: "Belong memes"
- assertVisible: "Paste a link"
- assertVisible:
    text: "^Photo$"
    below: "Belong memes"

# Leave the sheet without attaching or posting.
- pressKey: back
- assertNotVisible: ".*Attach media.*"
- assertVisible: ".*Add Meme / GIF.*"
- assertNotVisible: ".*Attached:.*"
