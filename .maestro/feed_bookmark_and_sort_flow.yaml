appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
---
# Requires Home chrome. "Vote & Feedback" is hidden on the sign-in wall (#601).
# "Feed" is a whole word so it does not match the Feedback chip.
# Intent filters on the live home feed: All, [Prayer Request], [Comfort Only],
# [Bible Deep-Dive]. Sort chips use Semantics ids. The runner fails the
# command if logcat shows a Flutter exception after the New Activity tap.
# Saved for Later is a Spaces row.

- launchApp:
    clearState: false

- runFlow:
    file: subflows/dev_saved_account_home.yaml

- extendedWaitUntil:
    visible: ".*Vote & Feedback.*"
    timeout: 45000
- assertVisible: ".*\\bFeed\\b.*"
- assertVisible: ".*\\[Prayer Request\\].*"
- assertVisible: ".*\\[Comfort Only\\].*"
- assertVisible: ".*\\[Bible Deep-Dive\\].*"

# Chip ids are feed_sort_chip_${opt.name}. Scroll the horizontal row
# until the id is on screen, then tap it. A screen swipe scrolls the feed.
- scrollUntilVisible:
    element:
      id: "feed_sort_chip_forYou"
    direction: RIGHT
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    id: "feed_sort_chip_forYou"
- assertVisible:
    id: "feed_sort_chip_forYou"
- scrollUntilVisible:
    element:
      id: "feed_sort_chip_newActivity"
    direction: RIGHT
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    id: "feed_sort_chip_newActivity"
- assertVisible:
    id: "feed_sort_chip_newActivity"
- scrollUntilVisible:
    element:
      id: "feed_sort_chip_latest"
    direction: LEFT
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    id: "feed_sort_chip_latest"
- assertVisible:
    id: "feed_sort_chip_latest"

- tapOn: ".*Spaces.*"
- extendedWaitUntil:
    visible: ".*Saved for Later.*"
    timeout: 15000
- assertVisible: ".*Saved for Later.*"

- tapOn: ".*\\bFeed\\b.*"
- assertVisible: ".*\\bFeed\\b.*"
