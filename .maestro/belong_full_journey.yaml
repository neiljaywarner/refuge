appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
---
# Belong on the Spectrum — end-to-end journey against the live accessibility tree.
# Header nodes may be separate ("Belong", "Refuge", "Calm Tech • Live|Resilient")
# or one combined label. Welcome copy is "Welcome to Belong on the Spectrum".
# Sensory menu labels are Clean, Sage, Dark, and Contrast.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Welcome to Belong on the Spectrum.*"
    timeout: 45000
- assertVisible: ".*Welcome to Belong on the Spectrum.*"
- assertVisible: ".*Belong.*"

- tapOn: ".*Sensory Themes.*"
- tapOn: "Dark.*"
- assertVisible: ".*Welcome to Belong on the Spectrum.*"

- tapOn: ".*Sensory Themes.*"
- tapOn: "Sage.*"
- assertVisible: ".*Welcome to Belong on the Spectrum.*"

- tapOn: ".*Spaces.*"
- extendedWaitUntil:
    visible: ".*General Chat.*"
    timeout: 15000
- assertVisible: ".*General Chat.*"

- tapOn: ".*About Belong.*"
- extendedWaitUntil:
    visible: ".*Psalm 139:14.*"
    timeout: 10000
- assertVisible: ".*Psalm 139:14.*"
- tapOn: "Close.*"

- tapOn: ".*Sign In.*"
- extendedWaitUntil:
    visible: ".*Sign [Ii]n.*"
    timeout: 15000
- assertVisible: ".*Sign [Ii]n.*"
- back
