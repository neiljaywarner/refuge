appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
---
# Clear-state launch is the members-only sign-in wall (#574, #601, #720).
# The old "Welcome to Belong on the Spectrum" home is not shown until sign-in.
# The signed-in walk (Spaces, notifications, delete) is dev_e2e_*.yaml.

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Sign in to Belong on the Spectrum.*"
    timeout: 45000
- assertVisible: ".*Sign in to Belong on the Spectrum.*"
- assertVisible: ".*Register.*"
- assertNotVisible: "Demo Mode"
- assertNotVisible: "Vote & Feedback"
