appId: com.belongonthespectrum.refuge.dev
# Dev package only. Password comes from MAESTRO_TEST_PASSWORD.
# Email comes from BELONG_AUTH_EMAIL (timestamped @yopmail.com).
tags:
  - known-gap
  - e2e
  - dev-only
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: ".*Sign in to Belong on the Spectrum.*"
    timeout: 45000
- tapOn: ".*Register.*"
- tapOn: ".*Email.*"
- inputText: ${BELONG_AUTH_EMAIL}
- tapOn: ".*Password.*"
- inputText: ${MAESTRO_TEST_PASSWORD}
# FirebaseUI label is "Confirm password"; an empty submit shows
# "Confirm your password". Either text is the same field.
- tapOn: "Confirm your password|Confirm password"
- inputText: ${MAESTRO_TEST_PASSWORD}
- hideKeyboard
# The screen title and the submit control both say Register.
# The one under the confirm field is the submit button.
- tapOn:
    text: "^Register$"
    below: "Confirm your password|Confirm password"
    index: 0
- extendedWaitUntil:
    visible: ".*(Feed|Save & Enter Belong|Check your email).*"
    timeout: 60000
- runFlow:
    when:
      visible: "Save & Enter Belong"
    commands:
      - tapOn: ".*Display name.*"
      - inputText: "Fellow Member"
      - tapOn: ".*congregation.*"
      - tapOn: "I am not a member of an ICOC church"
      - tapOn: "Save & Enter Belong"
      - extendedWaitUntil:
          visible: ".*\\bFeed\\b.*"
          timeout: 30000
