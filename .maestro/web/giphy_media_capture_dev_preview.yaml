url: https://dev-belongonthespectrum--giphy-666-qa-vasz0dlu.web.app
name: Giphy media capture — dev preview web (screens + video)
tags:
  - giphy
  - media-capture
---
- launchApp
- extendedWaitUntil:
    visible: ".*Belong.*"
    timeout: 120000
- tapOn: "Sign In"
- tapOn: "Email"
- inputText: ${GIPHY_QA_EMAIL}
- tapOn: "Password"
- inputText: ${GIPHY_QA_PASSWORD}
- tapOn: "^Sign in$"
- extendedWaitUntil:
    visible: ".*Share an unhurried thought.*|Check your email"
    timeout: 90000
- takeScreenshot:
    path: qa_artifacts/giphy/web_01_after_signin.png
- tapOn: ".*Spaces.*"
- tapOn: ".*Memes.*"
- tapOn: ".*Add Meme / GIF.*"
- takeScreenshot:
    path: qa_artifacts/giphy/web_02_gallery_curated.png
- tapOn:
    id: tab_giphy_search
    optional: true
- runFlow:
    when:
      notVisible:
        text: "Powered by GIPHY"
    commands:
      - tapOn:
          point: "25%,30%"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Powered by GIPHY"
    timeout: 90000
- takeScreenshot:
    path: qa_artifacts/giphy/web_03_giphy_trending_grid.png
- assertNotVisible:
    text: ".*Open Giphy.*"
    optional: true
- tapOn: "Search"
- inputText: quiet
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot:
    path: qa_artifacts/giphy/web_04_giphy_search_quiet.png
