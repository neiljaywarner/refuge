url: http://127.0.0.1:8095
name: grokbot signup sign-in direct message and mention
---
# Credentials are read from the shell environment (.maestro/.env.local, gitignored).
# This file must not contain email addresses or passwords.
# If a verify-email screen appears, the next assertion fails and the flow stops.

- launchApp
- extendedWaitUntil:
    visible: "Belong"
    timeout: 120000
- runFlow:
    when:
      visible: ".*Member Profile.*"
    commands:
      - tapOn: ".*Member Profile.*"
      - tapOn: "Sign Out"
      - extendedWaitUntil:
          visible: "Sign In"
          timeout: 20000

# Account 1 — create, or sign in when the account already exists.
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: ".*Don't have an account.*"
    timeout: 20000
- tapOn: "Register"
- extendedWaitUntil:
    visible: "Confirm password"
    timeout: 15000
- tapOn: "Email"
- inputText: ${GROKBOT1_EMAIL}
- tapOn: "Password"
- inputText: ${GROKBOT_PASSWORD}
- tapOn: "Confirm password"
- inputText: ${GROKBOT_PASSWORD}
- tapOn: "^Register$"
- extendedWaitUntil:
    visible: ".*Member Profile.*|Verify your email|.*already in use.*"
    timeout: 40000
- takeScreenshot: grokbot1_after_register
- assertNotVisible: "Verify your email"
- runFlow:
    when:
      visible: ".*already in use.*"
    commands:
      - tapOn: "Sign in"
      - extendedWaitUntil:
          notVisible: "Confirm password"
          timeout: 15000
      - tapOn: "Email"
      - eraseText: 80
      - inputText: ${GROKBOT1_EMAIL}
      - tapOn: "Password"
      - eraseText: 80
      - inputText: ${GROKBOT_PASSWORD}
      - tapOn: "^Sign in$"
      - extendedWaitUntil:
          visible: ".*Member Profile.*|Verify your email"
          timeout: 40000
      - takeScreenshot: grokbot1_after_existing_sign_in
      - assertNotVisible: "Verify your email"
- extendedWaitUntil:
    visible: ".*Member Profile.*"
    timeout: 20000
- takeScreenshot: grokbot1_signed_in
- tapOn: ".*Member Profile.*"
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 20000

# Account 2
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: ".*Don't have an account.*"
    timeout: 20000
- tapOn: "Register"
- extendedWaitUntil:
    visible: "Confirm password"
    timeout: 15000
- tapOn: "Email"
- inputText: ${GROKBOT2_EMAIL}
- tapOn: "Password"
- inputText: ${GROKBOT_PASSWORD}
- tapOn: "Confirm password"
- inputText: ${GROKBOT_PASSWORD}
- tapOn: "^Register$"
- extendedWaitUntil:
    visible: ".*Member Profile.*|Verify your email|.*already in use.*"
    timeout: 40000
- takeScreenshot: grokbot2_after_register
- assertNotVisible: "Verify your email"
- runFlow:
    when:
      visible: ".*already in use.*"
    commands:
      - tapOn: "Sign in"
      - extendedWaitUntil:
          notVisible: "Confirm password"
          timeout: 15000
      - tapOn: "Email"
      - eraseText: 80
      - inputText: ${GROKBOT2_EMAIL}
      - tapOn: "Password"
      - eraseText: 80
      - inputText: ${GROKBOT_PASSWORD}
      - tapOn: "^Sign in$"
      - extendedWaitUntil:
          visible: ".*Member Profile.*|Verify your email"
          timeout: 40000
      - takeScreenshot: grokbot2_after_existing_sign_in
      - assertNotVisible: "Verify your email"
- extendedWaitUntil:
    visible: ".*Member Profile.*"
    timeout: 20000
- takeScreenshot: grokbot2_signed_in
- tapOn: ".*Member Profile.*"
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 20000
- takeScreenshot: grokbot_signed_out
