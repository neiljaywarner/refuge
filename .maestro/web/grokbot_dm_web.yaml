url: http://127.0.0.1:8095
name: grokbot direct message notification
---
# Credentials come from the shell environment. No addresses are stored here.
# Expects both accounts to already exist.
#
# The recipient signs in first so a directory entry exists, then the sender
# selects that entry and sends a message. The recipient's bell must show it.
#
# Included in the web suite. See .maestro/web/config.yaml.

- launchApp
- extendedWaitUntil:
    visible: ".*Belong.*"
    timeout: 120000
- runFlow:
    when:
      visible: ".*Member Profile.*"
    commands:
      - tapOn: ".*Member Profile.*"
      - tapOn: "Sign Out"
      - extendedWaitUntil:
          visible: "Sign In"
          timeout: 20000

- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Email"
    timeout: 20000
- tapOn: "Email"
- inputText: ${GROKBOT2_EMAIL}
- tapOn: "Password"
- inputText: ${GROKBOT_PASSWORD}
- tapOn: "^Sign in$"
- extendedWaitUntil:
    visible: ".*Member Profile.*"
    timeout: 40000
- tapOn: ".*Member Profile.*"
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 20000

- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Email"
    timeout: 20000
- tapOn: "Email"
- inputText: ${GROKBOT1_EMAIL}
- tapOn: "Password"
- inputText: ${GROKBOT_PASSWORD}
- tapOn: "^Sign in$"
- extendedWaitUntil:
    visible: ".*Member Profile.*"
    timeout: 40000
- assertNotVisible: "Verify your email"
- tapOn: "(?s).*Messages.*"
- extendedWaitUntil:
    visible: "Direct Messages"
    timeout: 15000
- tapOn: "New Message"
- extendedWaitUntil:
    visible: "Search members \\(single or multiple\\).*"
    timeout: 15000
- tapOn: "Search members \\(single or multiple\\).*"
- inputText: "grokbot2"
- extendedWaitUntil:
    visible:
      id: "dm-recipient-match"
    timeout: 20000
- takeScreenshot: grokbot1_dm_recipient_search
- tapOn:
    id: "dm-recipient-match"
- tapOn:
    id: "new_message_content_input"
- inputText: "Quiet hello from the fellowship."
- tapOn: "Send Message"
- extendedWaitUntil:
    notVisible: "New Message"
    timeout: 20000
- takeScreenshot: grokbot1_dm_send_result
- tapOn: ".*Member Profile.*"
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 20000

- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Email"
    timeout: 20000
- tapOn: "Email"
- inputText: ${GROKBOT2_EMAIL}
- tapOn: "Password"
- inputText: ${GROKBOT_PASSWORD}
- tapOn: "^Sign in$"
- extendedWaitUntil:
    visible: ".*Member Profile.*"
    timeout: 40000
- tapOn: "(?s).*Notifications.*"
- extendedWaitUntil:
    visible: "Mark all read"
    timeout: 15000
- takeScreenshot: grokbot2_bell_after_dm
- extendedWaitUntil:
    visible: ".*Quiet hello from the fellowship.*"
    timeout: 20000
