url: http://127.0.0.1:8095
name: grokbot mention notification
---
# Credentials come from the shell environment. No addresses are stored here.
# Publishes one reflection that @-mentions grokbot2. Owner approved this test data.

- launchApp
- extendedWaitUntil:
    visible: "Belong"
    timeout: 120000
- runFlow:
    when:
      visible: ".*Member Profile.*"
    commands:
      - tapOn: ".*Member Profile.*"
      - tapOn: "Sign Out"
      - extendedWaitUntil:
          visible: "Sign In"
          timeout: 20000

- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Email"
    timeout: 20000
- tapOn: "Email"
- inputText: ${GROKBOT1_EMAIL}
- tapOn: "Password"
- inputText: ${GROKBOT_PASSWORD}
- tapOn: "^Sign in$"
- extendedWaitUntil:
    visible: ".*Member Profile.*"
    timeout: 40000
- assertNotVisible: "Verify your email"
- tapOn: ".*Share an unhurried thought.*"
- inputText: "Quiet hello grokbot-mention-token @grokbot2"
- tapOn: "Publish Reflection"
- extendedWaitUntil:
    visible: ".*grokbot-mention-token.*"
    timeout: 20000
- takeScreenshot: grokbot1_mention_post
- tapOn: ".*Member Profile.*"
- tapOn: "Sign Out"
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 20000

- tapOn: "Sign In"
- extendedWaitUntil:
    visible: "Email"
    timeout: 20000
- tapOn: "Email"
- inputText: ${GROKBOT2_EMAIL}
- tapOn: "Password"
- inputText: ${GROKBOT_PASSWORD}
- tapOn: "^Sign in$"
- extendedWaitUntil:
    visible: ".*Member Profile.*"
    timeout: 40000
- tapOn: "(?s).*Notifications.*"
- extendedWaitUntil:
    visible: "Mark all read"
    timeout: 15000
- takeScreenshot: grokbot2_bell_after_mention
- assertVisible: ".*grokbot-mention-token.*"
