url: https://dev-belongonthespectrum--giphy-666-qa-vasz0dlu.web.app
name: Giphy HTTP search on dev preview (PR 715 build)
tags:
  - giphy
  - qa
  - live-dev
---
#   GIPHY_QA_EMAIL, GIPHY_QA_PASSWORD
- launchApp
- extendedWaitUntil:
    visible: ".*Belong.*"
    timeout: 120000
- runFlow:
    when:
      visible: ".*Member Profile.*"
    commands:
      - tapOn: ".*Member Profile.*"
      - tapOn: "Sign Out"
      - extendedWaitUntil:
          visible: "Sign In"
          timeout: 20000
- tapOn: "Sign In"
- extendedWaitUntil:
    visible: ".*Register.*"
    timeout: 20000
- tapOn: "Register"
- extendedWaitUntil:
    visible: "Confirm password"
    timeout: 15000
- tapOn: "Email"
- inputText: ${GIPHY_QA_EMAIL}
- tapOn: "Password"
- inputText: ${GIPHY_QA_PASSWORD}
- tapOn: "Confirm password"
- inputText: ${GIPHY_QA_PASSWORD}
- tapOn: "^Register$"
- extendedWaitUntil:
    visible: ".*Member Profile.*|Verify your email|.*already in use.*|.*already exists.*"
    timeout: 45000
- runFlow:
    when:
      visible: ".*already in use.*|.*already exists.*"
    commands:
      - tapOn: "Sign in"
      - tapOn: "Email"
      - eraseText: 80
      - inputText: ${GIPHY_QA_EMAIL}
      - tapOn: "Password"
      - eraseText: 80
      - inputText: ${GIPHY_QA_PASSWORD}
      - tapOn: "^Sign in$"
      - extendedWaitUntil:
          visible: ".*Member Profile.*"
          timeout: 45000
- extendedWaitUntil:
    visible: ".*Member Profile.*"
    timeout: 30000
- takeScreenshot: giphy_qa_web_signed_in
- tapOn: ".*Spaces.*"
- tapOn: ".*Memes.*"
- extendedWaitUntil:
    visible: ".*Add Meme / GIF.*"
    timeout: 20000
- tapOn: ".*Add Meme / GIF.*"
- extendedWaitUntil:
    visible: ".*Search GIFs.*"
    timeout: 20000
- tapOn: ".*Search GIFs.*"
- extendedWaitUntil:
    visible: "Powered by GIPHY"
    timeout: 45000
- takeScreenshot: giphy_qa_web_giphy_panel
- assertNotVisible: ".*Open Giphy.*"
- extendedWaitUntil:
    visible: ".*quiet.*|.*GIF.*|.*Search.*"
    timeout: 30000
