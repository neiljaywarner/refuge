url: http://127.0.0.1:8095
name: Giphy media capture — localhost web (run before dev preview)
tags:
  - giphy
  - media-capture
  - localhost
---
- launchApp
- extendedWaitUntil:
    visible: ".*Belong.*"
    timeout: 120000
- runFlow:
    when:
      visible: ".*Share an unhurried thought.*"
    commands:
      - takeScreenshot:
          path: qa_artifacts/giphy/local_00_already_signed_in.png
- runFlow:
    when:
      visible: "Sign In"
    commands:
      - tapOn: "Sign In"
      - tapOn: "Email"
      - inputText: ${GIPHY_QA_EMAIL}
      - tapOn: "Password"
      - inputText: ${GIPHY_QA_PASSWORD}
      - tapOn: "^Sign in$"
      - extendedWaitUntil:
          visible: ".*Share an unhurried thought.*|Check your email"
          timeout: 90000
- takeScreenshot:
    path: qa_artifacts/giphy/local_01_after_signin.png
- tapOn: ".*Spaces.*"
- tapOn: ".*Memes.*"
- tapOn: ".*Add Meme / GIF.*"
- takeScreenshot:
    path: qa_artifacts/giphy/local_02_gallery_curated.png
- tapOn:
    id: tab_giphy_search
    optional: true
- runFlow:
    when:
      notVisible:
        text: "Powered by GIPHY"
    commands:
      - tapOn:
          point: "25%,30%"
          label: Search GIFs chip (web semantics fallback)
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible: "Powered by GIPHY"
    timeout: 90000
- takeScreenshot:
    path: qa_artifacts/giphy/local_03_giphy_trending_grid.png
- assertNotVisible:
    text: ".*Open Giphy.*"
    optional: true
- tapOn: "Search"
- inputText: quiet
- tapOn: "Search"
- waitForAnimationToEnd:
    timeout: 8000
- takeScreenshot:
    path: qa_artifacts/giphy/local_04_giphy_search_quiet.png
