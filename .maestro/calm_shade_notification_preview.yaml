appId: com.belongonthespectrum.refuge.dev
# Debug/dev package. See .maestro/config.yaml for prod and legacy ids.
name: "Calm shade notification preview (debug APK)"
tags:
  - notifications
  - fcm
  - regression
---
# bottom_nav_tab_notifications is often absent. The visible name is
# "Notifications tab". Preview button copy: "Preview shade notification".

- setPermissions:
    permissions:
      notifications: allow

- launchApp:
    clearState: false

- extendedWaitUntil:
    visible: ".*Notifications tab.*"
    timeout: 45000

- startRecording: calm_shade_preview.mp4

- tapOn: ".*Notifications tab.*"
- assertVisible: "Notifications.*"

- tapOn: ".*Calm Notification Preferences.*"
- extendedWaitUntil:
    visible: ".*Calm Notification Ethics.*"
    timeout: 10000
- assertVisible: ".*Calm Notification Ethics.*"

- tapOn: ".*Preview shade notification.*"

- pressKey: Home

- swipe:
    start: "50%, 2%"
    end: "50%, 55%"
    duration: 400

- assertVisible:
    text: ".*Fellow Member.*"
    optional: true

# Close the shade so a later flow is not stuck on the system UI.
- pressKey: back

- stopRecording
