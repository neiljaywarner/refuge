<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1160" width="900" height="1160" role="img" aria-labelledby="title desc">
  <title id="title">Refuge Digital COmmunity — Business &amp; Partnership Infographic</title>
  <desc id="desc">Visual summary of the problem, calm solution, three 37signals principles, and commercial partnership opportunity.</desc>
  <defs>
    <filter id="cardShadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#1E293B" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Warm Cream Editorial Paper Background -->
  <rect width="900" height="1160" fill="#FAF7F2"/>

  <!-- Header -->
  <text x="450" y="86" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="0.5" fill="#1E293B">REFUGE APP</text>
  <text x="450" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#334155">Starts as Ministry. Grows into a Calm Community Business.</text>

  <!-- Card 1: The Problem -->
  <rect x="44" y="166" width="394" height="360" rx="18" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="241" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#1E293B">1. THE PROBLEM</text>

  <!-- Bell + Bill Illustration -->
  <g transform="translate(135, 240)">
    <!-- Bell -->
    <path d="M46 18 C30 18 20 30 20 48 L14 64 L78 64 L72 48 C72 30 62 18 46 18 Z" fill="#688B72" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="46" cy="70" r="6" fill="#1E293B"/>
    <!-- Bill Document -->
    <g transform="translate(115, 6)">
      <rect x="0" y="0" width="78" height="96" rx="6" fill="#F8FAFC" stroke="#1E293B" stroke-width="2.5"/>
      <text x="39" y="25" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#1E293B">BILL</text>
      <line x1="14" y1="38" x2="64" y2="38" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="50" x2="54" y2="50" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="14" y1="62" x2="60" y2="62" stroke="#64748B" stroke-width="2.5" stroke-linecap="round"/>
      <text x="39" y="84" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="800" fill="#B45309">$1,500/yr</text>
    </g>
    <!-- Amber Strike X over Bell -->
    <line x1="4" y1="8" x2="90" y2="86" stroke="#C87D32" stroke-width="4" stroke-linecap="round"/>
    <line x1="90" y1="8" x2="4" y2="86" stroke="#C87D32" stroke-width="4" stroke-linecap="round"/>
  </g>

  <text x="241" y="396" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" fill="#1E293B">
    <tspan x="241" dy="0">Facebook &amp; Discord overwhelm</tspan>
    <tspan x="241" dy="27">sensitive people. Circle &amp;</tspan>
    <tspan x="241" dy="27">(verify?)church suites may cost $1,000–</tspan>
    <tspan x="241" dy="27">$10,000/yr for noisy clutter.</tspan>
  </text>

  <!-- Card 2: The Calm Solution -->
  <rect x="462" y="166" width="394" height="360" rx="18" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="659" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#1E293B">2. THE CALM SOLUTION</text>

  <!-- Tea + Laptop + Warm Chat Bubble Illustration -->
  <g transform="translate(548, 244)">
    <!-- Warm Chat Bubble -->
    <rect x="132" y="0" width="66" height="44" rx="10" fill="#D4955A" stroke="#1E293B" stroke-width="2.5"/>
    <polygon points="146,44 158,44 144,55" fill="#D4955A" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M150 22 Q154 16 158 22" fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M172 22 Q176 16 180 22" fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M158 31 Q165 37 172 31" fill="none" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Warm Tea Mug -->
    <rect x="40" y="34" width="36" height="32" rx="6" fill="#C87D32" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M76 42 C86 42 86 58 76 58" fill="none" stroke="#1E293B" stroke-width="2.5"/>
    <path d="M52 24 Q55 15 52 8" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>
    <path d="M64 24 Q67 15 64 8" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"/>

    <!-- Sage Laptop -->
    <polygon points="116,58 206,58 196,98 106,98" fill="#5B7F67" stroke="#1E293B" stroke-width="2.5"/>
    <circle cx="156" cy="78" r="5" fill="#FAF7F2"/>
    <line x1="16" y1="98" x2="216" y2="98" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <text x="659" y="396" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" fill="#1E293B">
    <tspan x="659" dy="0">A quiet, ad-free online home</tspan>
    <tspan x="659" dy="27">for neurodivergent adults,</tspan>
    <tspan x="659" dy="27">families &amp; churches. Live now as</tspan>
    <tspan x="659" dy="27">our church leaves Circle by Oct 31.</tspan>
  </text>

  <!-- Card 3: Built the 37signals Way -->
  <rect x="44" y="554" width="812" height="236" rx="18" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="450" y="602" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1E293B">3. BUILT THE 37SIGNALS WAY</text>

  <line x1="315" y1="628" x2="315" y2="762" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="585" y1="628" x2="585" y2="762" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Pillar 1 -->
  <text x="180" y="666" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#1E293B">Pick a Fight</text>
  <text x="180" y="708" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" fill="#334155">
    <tspan x="180" dy="0">Calm belonging</tspan>
    <tspan x="180" dy="26">over attention traps</tspan>
  </text>

  <!-- Pillar 2 -->
  <text x="450" y="654" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#1E293B">
    <tspan x="450" dy="0">Half, Not</tspan>
    <tspan x="450" dy="28">Half-Baked</tspan>
  </text>
  <text x="450" y="718" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" fill="#334155">
    <tspan x="450" dy="0">Core rooms done</tspan>
    <tspan x="450" dy="26">remarkably well</tspan>
  </text>

  <!-- Pillar 3 -->
  <text x="720" y="654" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#1E293B">
    <tspan x="720" dy="0">Embrace</tspan>
    <tspan x="720" dy="28">Constraints</tspan>
  </text>
  <text x="720" y="718" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18.5" fill="#334155">
    <tspan x="720" dy="0">Near-$0 overhead,</tspan>
    <tspan x="720" dy="26">no App Store tax</tspan>
  </text>

  <!-- Card 4: The Business & Partnership -->
  <rect x="44" y="818" width="812" height="254" rx="18" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1.5" filter="url(#cardShadow)"/>
  <text x="450" y="866" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="24" font-weight="800" fill="#1E293B">4. THE BUSINESS &amp; PARTNERSHIP</text>

  <line x1="315" y1="892" x2="315" y2="1042" stroke="#E2E8F0" stroke-width="2"/>
  <line x1="585" y1="892" x2="585" y2="1042" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Column 1 -->
  <text x="180" y="922" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1E293B">Who Needs It</text>
  <text x="180" y="958" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#334155">
    <tspan x="180" dy="0">Churches,</tspan>
    <tspan x="180" dy="25">Disability Non-Profits</tspan>
    <tspan x="180" dy="25">&amp; Support Groups</tspan>
  </text>

  <!-- Column 2 -->
  <text x="450" y="922" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="23" font-weight="800" fill="#5B7F67">$19–$77/mo</text>
  <text x="450" y="958" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#334155">
    <tspan x="450" dy="0">Hosted Spaces •</tspan>
    <tspan x="450" dy="25">$1.5k–$5k White-</tspan>
    <tspan x="450" dy="25">Glove Setup</tspan>
  </text>

  <!-- Column 3 -->
  <text x="720" y="914" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="800" fill="#1E293B">
    <tspan x="720" dy="0">Zero-Pressure</tspan>
    <tspan x="720" dy="26">Partnership</tspan>
  </text>
  <text x="720" y="976" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#334155">
    <tspan x="720" dy="0">Advise, Co-Build,</tspan>
    <tspan x="720" dy="25">or Take the Lead</tspan>
  </text>
</svg>
