<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#F2EEE2">
  <meta name="description" content="Belong on the Spectrum — You belong here. A calm, neurodivergent-affirming Christian & autistic fellowship community.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Belong">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Belong on the Spectrum</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #F2EEE2;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    #belong-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #F2EEE2;
      color: #0F2336;
      z-index: 9999;
      transition: opacity 260ms ease-out;
    }
    #belong-splash img {
      width: 112px;
      height: 112px;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(15, 35, 54, 0.08);
      margin-bottom: 18px;
    }
    #belong-splash h1 {
      margin: 0 0 6px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #0F2336;
    }
    #belong-splash p {
      margin: 0;
      font-size: 14px;
      color: #4A635D;
    }
  </style>
</head>
<body>
  <div id="belong-splash" role="status" aria-label="Loading Belong on the Spectrum">
    <img src="icons/Icon-192.png" alt="Belong on the Spectrum logo" />
    <h1>Belong on the Spectrum</h1>
    <p>You belong here.</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('belong-splash');
      if (splash) {
        splash.style.opacity = '0';
        setTimeout(function () {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 280);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
