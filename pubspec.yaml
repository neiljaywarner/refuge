name: refuge4serverpod
description: "Sanctuary (Refuge) - Calm-tech digital community platform for Belong on the Spectrum built with Serverpod 4."
publish_to: 'none'

version: 0.9.0+1

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  talker_flutter: ^5.1.20
  serverpod_client: ^4.0.4
  sanctuary_server_client:
    path: sanctuary_server/sanctuary_server_client
  firebase_core: ^5.0.0
  firebase_analytics: ^13.0.0
  firebase_remote_config: ^7.0.0
  firebase_crashlytics: ^6.0.0
  firebase_auth: ^7.0.0
  firebase_messaging: ^17.0.0
  firebase_performance: ^0.12.0
  firebase_app_check: ^0.5.0
  firebase_ui_auth: ^3.1.1
  firebase_ui_localizations: ^2.1.0
  flutter_localizations:
    sdk: flutter
  salomon_bottom_bar: ^3.3.2
  url_launcher: ^6.3.3
  equatable: ^2.1.0
  marionette_flutter: ^0.7.0
  cloud_firestore: ^7.0.0
  gap: ^3.0.1
  http: ^1.2.0
  appwrite: ^28.1.0
  image_picker: ^1.2.4
  firebase_in_app_messaging: ^0.10.0
  firebase_app_installations: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  patrol_finders: ^3.6.0
  integration_test:
    sdk: flutter
  args: ^2.5.0
  rps: ^0.10.1

scripts:
  test:
    $description: "Runs the test suite across unit, widget, and feature domains"
    $default: flutter test
    unit: flutter test test/unit
    widget: flutter test test/widget
    features: flutter test test/features
    concurrency: flutter test test/features/concurrency
    tool: flutter test test/tool
  analyze:
    $description: "Performs static analysis with zero lint warnings"
    $default: flutter analyze
  format:
    $description: "Checks or formats Dart code styling"
    $default: dart format --output=none --set-exit-if-changed .
    apply: dart format .
  check:
    $description: "Full local pre-flight gate: format check, static analysis, and tests"
    $script:
      - rps format
      - rps analyze
      - rps test
  cli:
    $description: "Pure-Dart Refuge automation CLI for PR hygiene, wiki sync, and audits"
    $default: dart run tool/refuge_cli.dart
    help: dart run tool/refuge_cli.dart help
    privacy: dart run tool/refuge_cli.dart privacy-scan
    review: dart run tool/refuge_cli.dart review-status
    merge: dart run tool/refuge_cli.dart merge-pr
  device:
    $description: "Hardware driving, Maestro flows, and physical glass regression"
    $default: dart run tool/run_physical_glass_regression.dart
    regression: dart run tool/run_physical_glass_regression.dart
    dry-run: dart run tool/run_physical_glass_regression.dart --dry-run
    maestro: dart run tool/run_maestro_verification.dart
    dual-demo: dart run tool/run_dual_pixel_demo.dart
    staggered-demo: dart run tool/run_dual_pixel_demo.dart --staggered --record
  ollama:
    $description: "Local Apple Silicon offline AI and LLM orchestration"
    $default: dart run tool/setup_ollama.dart
    setup: dart run tool/setup_ollama.dart
    verify: dart run tool/verify_ollama.dart
    status: dart run tool/setup_ollama.dart --check-only

dependency_overrides:
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
