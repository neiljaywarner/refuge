name: refuge4serverpod
description: "Sanctuary (Refuge) - Calm-tech digital community platform for Belong on the Spectrum built with Serverpod 4."
publish_to: 'none'

version: 0.9.9+9990

environment:
  sdk: ^3.13.5
  flutter: ">=3.47.7"

# Milestone 1.2 Tooling Alternatives Epic (Dio/Retrofit, Freezed, Derry vs RPS):
# https://github.com/neiljaywarner/refuge/issues/831
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  flutter_riverpod: ^2.6.1
  hooks_riverpod: ^2.6.1
  flutter_hooks: ^0.21.3+1
  talker_flutter: ^5.1.20
  serverpod_client: ^4.0.4
  sanctuary_server_client:
    path: sanctuary_server/sanctuary_server_client
  firebase_core: ^5.0.0
  firebase_analytics: ^13.0.0
  firebase_remote_config: ^7.0.0
  firebase_crashlytics: ^6.0.0
  firebase_auth: ^7.0.0
  firebase_messaging: ^17.0.0
  flutter_local_notifications: ^22.3.2
  firebase_performance: ^0.12.0
  firebase_app_check: ^0.5.0
  firebase_ui_auth: ^3.1.1
  firebase_ui_localizations: ^2.1.0
  flutter_localizations:
    sdk: flutter
  salomon_bottom_bar: ^3.3.2
  url_launcher: ^6.3.3
  package_info_plus: ^10.2.2
  # Data Modeling & Immutability:
  # Evaluated in Epic #831 & Issue #834:
  # https://github.com/neiljaywarner/refuge/issues/834
  # Currently using Equatable + handcrafted copyWith & Dart 3 sealed classes/pattern matching.
  # Sub-issue #834 evaluates package:freezed + json_serializable for 1.2 state models.
  equatable: ^2.1.0
  marionette_flutter: ^0.7.0
  cloud_firestore: ^7.0.0
  gap: ^3.0.1
  # HTTP Client & REST:
  # Evaluated in Epic #831 (1.2 Tooling Alternatives) & Issue #833:
  # https://github.com/neiljaywarner/refuge/issues/831
  # https://github.com/neiljaywarner/refuge/issues/833
  # Currently using lightweight package:http for Appwrite Cloud Function triggers and Nock tests.
  # Sub-issue #833 benchmarks package:dio + retrofit for interceptors and Talker retry chains.
  http: ^1.2.0
  appwrite: ^28.1.0
  image_picker: ^1.2.4
  firebase_in_app_messaging: ^0.10.0
  firebase_app_installations: ^0.5.0
  shared_preferences: ^2.5.6
  crop_your_image: ^2.0.1
  permission_handler: ^11.4.0
  giphy_flutter_sdk: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  belong_lints:
    path: packages/belong_lints
  pyramid_lint: ^3.0.0
  mocktail: ^1.0.4
  patrol_finders: ^3.6.0
  image: ^4.12.0
  integration_test:
    sdk: flutter
  args: ^2.5.0
  crypto: ^3.0.7
  # Task Runner & Scripts:
  # Evaluated in Epic #831 & Issue #835:
  # https://github.com/neiljaywarner/refuge/issues/835
  # Comparing rps (in pubspec.yaml) vs derry (in derry.yaml) vs native Dart CLI (tool/*.dart).
  rps: ^0.10.1
  patrol: ^4.10.0
  fake_cloud_firestore: ^4.5.0
  # charlatan 0.5.0 requires Dart 2 (`sdk: <3.0.0`) and does not resolve here.
  # nock is the Dart 3 cassette stand-in for http.Client / Appwrite HttpClient.
  nock: ^1.2.3
  path_provider_platform_interface: ^2.1.2
  url_launcher_platform_interface: ^2.3.2

# Project Script Automation (rps runner):
# Evaluated against derry (Issue #835) and native Dart CLI tools (tool/*.dart) for Milestone 1.2:
# https://github.com/neiljaywarner/refuge/issues/835
scripts:
  test:
    $description: "Runs the test suite across unit, widget, and feature domains"
    $default: flutter test
    unit: flutter test test/unit
    widget: flutter test test/widget
    features: flutter test test/features
    concurrency: flutter test test/features/concurrency
    tool: flutter test test/tool
  coverage:
    $description: "Line coverage for the CI manifest. No device and no live backend."
    $default: dart run tool/run_soft_launch_coverage.dart
  analyze:
    $description: "Performs static analysis with zero lint warnings"
    $default: flutter analyze
  format:
    $description: "Checks or formats Dart code styling. Page width stays at the SDK default until issue #519."
    $default: dart format --output=none --set-exit-if-changed .
    apply: dart format .
  check:
    $description: "Full local pre-flight gate: format check, static analysis, and tests"
    $script:
      - rps format
      - rps analyze
      - rps test
  cli:
    $description: "Pure-Dart Refuge automation CLI for PR hygiene, wiki sync, and audits"
    $default: dart run tool/refuge_cli.dart
    help: dart run tool/refuge_cli.dart help
    privacy: dart run tool/refuge_cli.dart privacy-scan
    review: dart run tool/refuge_cli.dart review-status
    merge: dart run tool/refuge_cli.dart merge-pr
  device:
    $description: "Hardware driving, Maestro flows, and physical glass regression"
    $default: dart run tool/run_physical_glass_regression.dart
    regression: dart run tool/run_physical_glass_regression.dart
    dry-run: dart run tool/run_physical_glass_regression.dart --dry-run
    maestro: dart run tool/run_maestro_verification.dart
    dual-demo: dart run tool/run_dual_pixel_demo.dart
    staggered-demo: dart run tool/run_dual_pixel_demo.dart --staggered --record
  ollama:
    $description: "Local Apple Silicon offline AI and LLM orchestration"
    $default: dart run tool/setup_ollama.dart
    setup: dart run tool/setup_ollama.dart
    verify: dart run tool/verify_ollama.dart
    status: dart run tool/setup_ollama.dart --check-only

dependency_overrides:
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0

patrol:
  app_name: "[DEV] Belong on the Spectrum"
  test_directory: integration_test
  android:
    package_name: com.belongonthespectrum.refuge.dev

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/giphy/
